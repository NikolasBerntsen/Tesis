# Análisis de SonarQube para el Comando Central.
#
# El repositorio es un monorepo con tres componentes (backend Node/TypeScript,
# consola web React/TypeScript y app Android en Kotlin) y se analiza como UN
# solo proyecto de Sonar, desde la raíz. Esa decisión es la que explica casi
# todo lo que sigue: las rutas de los informes de cobertura y de tests se
# resuelven contra ESTA carpeta, así que los reportes tienen que nombrar los
# archivos desde acá (backend/src/..., frontend/src/...) y no desde su módulo.
# Por eso vitest está configurado con `projectRoot` y `onWritePath` en
# backend/vitest.config.ts y frontend/vitest.config.ts: sin eso Sonar no
# resuelve un solo archivo y la cobertura aparece en cero SIN dar error.
#
# Cómo correrlo: ver docs/SONARQUBE.md

# ---- Identidad del proyecto ----
# Estos dos valores los define SonarQube cuando se crea el proyecto. Los de acá
# son los que genera SonarQube Cloud al importar un repositorio de GitHub
# (<organización>_<repositorio>); si tu instancia te muestra otros, reemplazalos.
sonar.projectKey=NikolasBerntsen_Tesis
sonar.organization=nikolasberntsen
sonar.projectName=Comando Central — patrullaje con drones
sonar.projectVersion=0.1.0

# En una instancia propia (SonarQube Server), `sonar.organization` no existe:
# comentá esa línea y pasá la URL del servidor con SONAR_HOST_URL.

# ---- Qué se analiza ----
sonar.sourceEncoding=UTF-8

# Código de producción de los tres componentes.
sonar.sources=backend/src,frontend/src,android-app/app/src/main/java,android-app/app/src/mock/java,android-app/app/src/dji/java

# Los tests. En el backend y en Android viven en su propia carpeta; en la
# consola están al lado del componente que prueban (Console.tsx / Console.test.tsx),
# así que `frontend/src` aparece en las dos listas y lo que decide es
# `sonar.test.inclusions`: lo que cae ahí es test, el resto es fuente.
sonar.tests=backend/tests,frontend/src,android-app/app/src/test/java
sonar.test.inclusions=backend/tests/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**,android-app/app/src/test/**

# Y la contracara: los mismos archivos se sacan de las fuentes, para que un
# archivo no quede indexado dos veces (Sonar aborta el análisis si pasa).
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.test.ts,**/*.test.tsx,frontend/src/test/**

# ---- Cobertura ----
# TypeScript (backend y consola): un lcov por módulo.
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Kotlin: el XML de JaCoCo que genera `createMockDebugUnitTestCoverageReport`
# (habilitado con `enableUnitTestCoverage` en app/build.gradle.kts).
sonar.coverage.jacoco.xmlReportPaths=android-app/app/build/reports/coverage/test/mock/debug/report.xml

# Lo que se saca de la CUENTA de cobertura (no del análisis: sus bugs y code
# smells se siguen reportando).
#
# Esta lista tiene que coincidir con la de `coverage.exclude` de los
# vitest.config.ts. Cuando no coincidían, vitest informaba 99 % y Sonar 88 %
# sobre el mismo código, y la diferencia no era un error de Sonar: eran archivos
# que ningún test cargaba y que vitest, por estar excluidos, ni mencionaba.
#
#   - `dji`: no se compila en CI (necesita `-PenableDji`, la API key del MSDK y
#     el hardware), así que ningún test puede cubrirlo y contarlo como código
#     sin cubrir sería engañoso.
#   - los dos entrypoints: tres líneas cada uno que solo llaman a listen() y a
#     createRoot(). No tienen lógica que un test pueda comprobar.
#
# Nada más entra acá. En particular NO entran ni el seed ni DronesMap, que
# estuvieron excluidos y hoy tienen tests propios.
sonar.coverage.exclusions=android-app/app/src/dji/**,backend/src/index.ts,frontend/src/main.tsx

# ---- Ejecución de los tests ----
# Cuántos tests corrieron, cuánto tardaron y cuáles fallaron. Para TypeScript es
# el formato genérico de Sonar, que emite vitest-sonar-reporter.
sonar.testExecutionReportPaths=backend/coverage/tests-sonar.xml,frontend/coverage/tests-sonar.xml

# Para Kotlin, los XML de JUnit que deja Gradle.
sonar.junit.reportPaths=android-app/app/build/test-results/testMockDebugUnitTest
