# Levanta los tres servicios del MVP. La app Android se corre aparte desde
# Android Studio y llega a estos puertos por 10.0.2.2 (emulador) o por la IP
# de la LAN (teléfono físico).
services:
  backend:
    build: ./backend
    container_name: tesis-backend
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      JWT_SECRET: secreto-dev-cambiar
      # La base vive en un volumen y no en el bind mount: SQLite sobre un
      # directorio compartido con Windows puede dar problemas de locking.
      DB_FILE: /data/comando-central.db
    volumes:
      - ./backend:/app
      - backend-node-modules:/app/node_modules
      - backend-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  frontend:
    build: ./frontend
    container_name: tesis-frontend
    ports:
      - "5173:5173"
    environment:
      # Dentro de la red de Compose el backend se resuelve por nombre
      BACKEND_URL: http://backend:4000
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

  detection:
    build: ./detection-mock
    container_name: tesis-detection
    ports:
      - "8765:8765"
    volumes:
      - ./detection-mock:/app
      - detection-node-modules:/app/node_modules

volumes:
  backend-node-modules:
  frontend-node-modules:
  detection-node-modules:
  backend-data:
