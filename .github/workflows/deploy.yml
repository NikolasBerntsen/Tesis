name: Deploy a Oracle Cloud

# Copia el código por rsync y la VM construye y levanta los contenedores. No hay registry
# de imágenes ni agente en el servidor.
#
# Lo llama el CI de main apenas las TRES suites están en verde (ver el job
# `desplegar` de ci.yml): un commit que rompe los tests nunca llega a la VM.
#
# Antes se disparaba con `workflow_run` al terminar TODO el CI, y eso incluía el
# análisis de SonarQube: el despliegue quedaba esperando ~6 minutos a una
# medición de calidad que no dice nada sobre si el código anda. Ahora corre en
# paralelo con ese análisis, no atrás.
on:
  workflow_call: {}
  workflow_dispatch: {}

# Los despliegues se encolan en vez de pisarse: cortar un "compose up" a la
# mitad dejaría el stack a medio levantar.
concurrency:
  group: deploy-oracle
  cancel-in-progress: false

env:
  VM_HOST: 144.22.138.149
  VM_USER: ubuntu
  DEST: /home/ubuntu/tesis

jobs:
  deploy:
    name: Desplegar en la VM de Oracle
    runs-on: ubuntu-latest
    steps:
      # Llamado desde el CI, `github.sha` ya es el commit que acaba de pasar los
      # tests, así que el checkout por defecto despliega exactamente eso.
      - uses: actions/checkout@v4

      # Un secret vacío da un "Permission denied (publickey)" sin explicación:
      # mejor fallar acá con un mensaje claro.
      - name: Verificar la clave SSH
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY || secrets.VM_SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::error::Falta el secret ORACLE_SSH_KEY (o VM_SSH_KEY) con la clave privada de la VM."
            exit 1
          fi

      - name: Preparar la clave y el host conocido
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY || secrets.VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # --delete deja la VM igual al repo. Se excluye el .env (los secretos de
      # producción viven sólo en la VM) y lo que se construye o no hace falta
      # allá (la app Android no se despliega).
      - name: Copiar el código a la VM
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy" \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            --exclude 'coverage/' \
            --exclude 'android-app/' \
            --exclude '*.db' \
            ./ "$VM_USER@$VM_HOST:$DEST/"

      # DEV_WIPE_DB llega como variable del repositorio (Settings → Variables).
      # Si no está definida, manda la del .env de la VM. En cualquiera de los
      # dos lados, `true` significa que ESTE despliegue borra la base.
      - name: Construir y levantar los contenedores
        env:
          DEV_WIPE_DB: ${{ vars.DEV_WIPE_DB }}
        run: |
          ssh -i ~/.ssh/id_deploy "$VM_USER@$VM_HOST" bash -s <<EOF
          set -e
          cd "$DEST"
          DEV_WIPE_DB='${DEV_WIPE_DB}' bash deploy/deploy.sh update
          EOF
