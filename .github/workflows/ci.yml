name: CI

on:
  push:
    branches: [main]
  pull_request:

# Al empujar varias veces seguidas, la corrida anterior de esa misma rama deja de
# tener sentido y se cancela. En main NO se cancela: de esa corrida depende el
# despliegue, y cortarla a la mitad dejaría a la VM sin actualizar.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (tests + cobertura)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Tests con cobertura
        run: npm run test:cov
      - name: Reporte de cobertura del backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/coverage

  frontend:
    name: Frontend (build + tests + cobertura)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Tests con cobertura
        run: npm run test:cov
      - name: Reporte de cobertura del frontend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-frontend
          path: frontend/coverage

  android:
    name: App Android (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Cachea la distribución de Gradle y las dependencias entre corridas. Sin
      # esto cada build bajaba Gradle entero (~130 MB) y todo el árbol de
      # dependencias, que era la mayor parte del tiempo del job; y además ese
      # bajado es el que falló con "Unexpected end of file from server" cuando
      # services.gradle.org tuvo un hipo.
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: false
          # En las ramas se lee el caché de main y no se escribe uno por rama:
          # así no se llenan los 10 GB que GitHub da por repositorio.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Robolectric baja sus imágenes de Android la primera vez que corre un
      # test, y no van por el caché de Gradle sino por el de Maven.
      - name: Caché de las imágenes de Robolectric
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('android-app/app/build.gradle.kts') }}
          restore-keys: robolectric-${{ runner.os }}-

      # `packages` se fija a mano porque el default de la acción es
      # "tools platform-tools", y `tools` es un paquete que Google retiró del
      # repositorio del SDK: sdkmanager sale con "Failed to find package 'tools'"
      # y el job muere antes de compilar nada. Del resto del SDK se encarga la
      # imagen del runner, que ya trae la plataforma y las build-tools.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # El wrapper baja Gradle de services.gradle.org y NO reintenta: si ese
      # servidor corta la conexión, el job muere en menos de un segundo sin que
      # haya nada roto en el código. Pasó dos veces en trece minutos.
      #
      # Va en un paso aparte, y no envolviendo el build, para que se reintente
      # SOLO la descarga: si falla la compilación o un test, tiene que fallar a
      # la primera y no tardar el triple en decirlo.
      - name: Asegurar la distribución de Gradle
        run: |
          for intento in 1 2 3 4 5; do
            if ./gradlew --version; then exit 0; fi
            espera=$((intento * 10))
            echo "::warning::No se pudo obtener Gradle (intento $intento de 5). Reintento en ${espera}s."
            sleep "$espera"
          done
          echo "::error::services.gradle.org no respondió después de 5 intentos. No es un problema del código."
          exit 1

      # `createMockDebugUnitTestCoverageReport` depende de la tarea de tests, así
      # que corre la suite igual; se nombra aparte para que se vea que además
      # produce el XML de JaCoCo que consume SonarQube.
      - name: Build + tests unitarios + cobertura (flavor mock)
        run: ./gradlew assembleMockDebug testMockDebugUnitTest createMockDebugUnitTestCoverageReport --build-cache --no-daemon
      - name: Reporte de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-android
          path: android-app/app/build/reports/tests
      # Las dos rutas cuelgan de android-app/app/build, así que el artefacto
      # queda con esa raíz común y el job de Sonar lo descomprime ahí mismo para
      # que las rutas vuelvan a ser las que espera sonar-project.properties.
      - name: Cobertura y resultados de la app Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-android
          path: |
            android-app/app/build/reports/coverage/test/mock/debug/report.xml
            android-app/app/build/test-results/testMockDebugUnitTest

  sonar:
    name: SonarQube (calidad y cobertura)
    runs-on: ubuntu-latest
    # Espera a los tres para juntar sus informes. `always()` no: si una suite
    # falló, la cobertura que subió está incompleta y analizarla diría cualquier
    # cosa. Lo que se analiza es un árbol con los tres en verde.
    needs: [backend, frontend, android]
    steps:
      - uses: actions/checkout@v4
        with:
          # Sonar fecha cada línea con el historial de git para saber qué es
          # "código nuevo" y a quién atribuirle cada issue. Con el clon
          # superficial que hace checkout por defecto, pierde las dos cosas.
          fetch-depth: 0

      - name: Cobertura del backend
        uses: actions/download-artifact@v4
        with:
          name: cobertura-backend
          path: backend/coverage
      - name: Cobertura de la consola
        uses: actions/download-artifact@v4
        with:
          name: cobertura-frontend
          path: frontend/coverage
      - name: Cobertura de la app Android
        uses: actions/download-artifact@v4
        with:
          name: cobertura-android
          path: android-app/app/build

      # Antes de analizar: que los informes estén donde el .properties dice. Si
      # una ruta se movió, Sonar NO falla — publica cobertura cero y el tablero
      # miente. Preferimos romper acá, con el archivo que falta escrito.
      - name: Verificar que los informes están en su lugar
        run: |
          faltan=0
          for informe in \
            backend/coverage/lcov.info \
            backend/coverage/tests-sonar.xml \
            frontend/coverage/lcov.info \
            frontend/coverage/tests-sonar.xml \
            android-app/app/build/reports/coverage/test/mock/debug/report.xml
          do
            if [ -s "$informe" ]; then
              echo "ok  $informe"
            else
              echo "::error::Falta el informe $informe: Sonar publicaría cobertura cero sin avisar."
              faltan=1
            fi
          done
          exit $faltan

      # Sin el secreto configurado no hay análisis posible. En vez de dejar el CI
      # en rojo (por ejemplo en un fork, que no recibe secretos), se saltea y
      # explica qué falta: ver docs/SONARQUBE.md.
      - name: ¿Está configurado el acceso a SonarQube?
        id: acceso
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "configurado=true" >> "$GITHUB_OUTPUT"
          else
            echo "configurado=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Falta el secreto SONAR_TOKEN: se saltea el análisis (ver docs/SONARQUBE.md)."
          fi

      - name: Análisis de SonarQube
        if: steps.acceso.outputs.configurado == 'true'
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # Para SonarQube Cloud NO alcanza con dejar la variable vacía: el
          # scanner la lee igual, arma la URL sin esquema y muere en un segundo
          # con "Expected URL scheme 'http' or 'https'". Por eso el valor por
          # defecto explícito. En una instancia propia se define la variable del
          # repositorio (Settings › Variables) con su URL y esta línea la toma.
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
