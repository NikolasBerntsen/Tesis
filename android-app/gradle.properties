org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m

# Caché de tareas: en el CI, con el caché restaurado, la mayoría de las tareas
# se saltean en vez de rehacerse. Es lo que hace que la segunda corrida del
# mismo commit (la de main, después del merge) sea corta.
org.gradle.caching=true
# Los módulos independientes se compilan a la vez. El runner tiene varios
# núcleos y estaban ociosos.
org.gradle.parallel=true
# Kotlin incremental: sólo recompila lo que cambió.
kotlin.incremental=true
android.useAndroidX=true
kotlin.code.style=official
# API key de DJI Developer (solo necesaria para el flavor "dji")
DJI_API_KEY=
